name: Build Keychron ZMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Process
    steps:
      - name: Checkout User Config
        uses: actions/checkout@v4
        with:
          path: user-config

      - name: Checkout Keychron Official ZMK Source
        uses: actions/checkout@v4
        with:
          repository: Keychron/zmk
          ref: zmk
          path: zmk-main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize West Workspace
        run: |
          pip3 install west
          cd zmk-main
          west init -m https://github.com --mr zmk ..
          west update
          
      - name: Copy User Keymap into Workspace
        run: |
          cp user-config/config/keychron_k3_se2.keymap zmk-main/app/boards/arm/keychron_k3_se2/keychron_k3_se2.keymap

      - name: Build Firmware
        run: |
          cd zmk-main
          west build -s app -b keychron_k3_se2

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keychron_k3_se2_firmware
          path: zmk-main/build/zephyr/zmk.uf2
