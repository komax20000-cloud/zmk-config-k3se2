name: Build Keychron ZMK Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Force Authentication Bypass Build
    steps:
      - name: Checkout User Config
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Keychron ZMK Source with Token Bypass
        run: |
          pip3 install west
          git clone --depth 1 -b zmk https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com zmk_source
          cd zmk_source
          west init -m https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com --mr zmk
          west update

      - name: Inject User Keymap and Build
        run: |
          cp config/keychron_k3_se2.keymap zmk_source/app/boards/arm/keychron_k3_se2/keychron_k3_se2.keymap
          cd zmk_source
          west build -s app -b keychron_k3_se2

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keychron_k3_se2_firmware
          path: zmk_source/build/zephyr/zmk.uf2
